<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2B0D1C">
<title>The Deepanshi Experience ❤️</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div id="hearts" aria-hidden="true"></div>

<header class="topbar">
  <button id="btnHome" class="icon" aria-label="Home (pehla page)">⌂</button>
  <div class="brand" id="brand">The Deepanshi Experience ❤️</div>
  <div class="tools">
    <button id="btnMusic" class="icon" aria-label="Song">♪</button>
    <button id="btnMute" class="icon" aria-label="Mute" hidden>🔊</button>
    <button id="btnMenu" class="icon" aria-label="Saare chapters">☰</button>
  </div>
</header>

<main id="stage"></main>

<nav class="bottomnav" aria-label="Page navigation">
  <div class="progress" role="progressbar" aria-valuemin="1" aria-valuemax="10" id="progress"><span id="progressBar"></span></div>
  <div class="navrow">
    <button id="btnPrev" class="navbtn">‹ Previous</button>
    <div class="chap"><div id="dots" class="dots"></div><div id="chapLabel" class="chaplabel"></div></div>
    <button id="btnNext" class="navbtn">Next ›</button>
  </div>
</nav>

<div id="menu" class="overlay" hidden></div>
<div id="lightbox" class="overlay lb" hidden></div>
<div id="noteModal" class="overlay" hidden></div>
<div id="finale" class="finale" hidden></div>
<aside id="editor" hidden></aside>
<button id="editFab" class="fab" hidden>✏️ Edit</button>
<div id="toast" role="status" aria-live="polite"></div>
<canvas id="fx" aria-hidden="true"></canvas>
<audio id="aud" loop preload="none"></audio>

<noscript><p style="position:fixed;inset:0;z-index:99;background:#2B0D1C;color:#FFF5F0;padding:40px;text-align:center">Is website ko chalane ke liye JavaScript on karo ❤️</p></noscript>

<script src="content.js"></script>
<script src="app.js"></script>
</body>
</html>
